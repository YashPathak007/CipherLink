services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cipherlink
      POSTGRES_USER: cipherlink
      POSTGRES_PASSWORD: cipherlink
    volumes: [cipherlink_db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U cipherlink -d cipherlink"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: .
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://cipherlink:cipherlink@db:5432/cipherlink
      JWT_SECRET: ${JWT_SECRET}
      MASTER_KEY_HEX: ${MASTER_KEY_HEX}
      CORS_ORIGIN: http://localhost:5174
      STORAGE_DIR: /var/lib/cipherlink/files
      MAX_FILE_SIZE: 10485760
      DEMO_PASSWORD: ${DEMO_PASSWORD}
    ports: ["4000:4000"]
    volumes: [cipherlink_files:/var/lib/cipherlink/files]
    command: sh -c "node dist/seed.js && node dist/server.js"
    depends_on:
      db: {condition: service_healthy}
  frontend:
    build: ./frontend
    environment: {VITE_API_URL: http://localhost:4000/api}
    ports: ["5174:5173"]
    depends_on: [backend]
volumes:
  cipherlink_db:
  cipherlink_files:
